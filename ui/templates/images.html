{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <!-- VM Images Overview -->
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">
                    <i class="fas fa-image me-2"></i>
                    VM Images
                </h5>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createImageModal">
                    <i class="fas fa-plus me-2"></i>
                    Create Image
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Image ID</th>
                                <th>Language</th>
                                <th>Version</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="imagesTable">
                            <tr>
                                <td colspan="5" class="text-center">Loading images...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Create Image Modal -->
<div class="modal fade" id="createImageModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create VM Image</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createImageForm">
                    <div class="mb-3">
                        <label for="language" class="form-label">Language</label>
                        <select class="form-select" id="language" required>
                            <option value="">Select a language</option>
                            <option value="python">Python</option>
                            <option value="nodejs">Node.js</option>
                            <option value="streamlit">Streamlit</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="version" class="form-label">Version</label>
                        <input type="text" class="form-control" id="version" required placeholder="e.g., 3.12">
                    </div>
                    <div class="mb-3">
                        <label for="requirements" class="form-label">Requirements (optional)</label>
                        <textarea class="form-control" id="requirements" rows="4" placeholder="# One package per line&#10;numpy==1.24.0&#10;pandas>=2.0.0"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="createImageBtn">Create Image</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/images.js') }}"></script>
{% endblock %}
